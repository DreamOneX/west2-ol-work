[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fzu-jxtz-crawler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fake-useragent>=2.2.0",
    "httpx>=0.28.1",
    "lxml>=6.0.2",
    "pandas>=2.3.3",
    "rich>=14.2.0",
]
authors = [
    { name = "DreamOneX", email = "me@dreamonex.eu.org" },
]

[project.scripts]
fzu-jxtz-crawler = "fzu_jxtz_crawler.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fzu_jxtz_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "lxml-stubs>=0.5.1",
    "pandas-stubs>=2.3.3.251201",
    "pytest>=9.0.2",
]
