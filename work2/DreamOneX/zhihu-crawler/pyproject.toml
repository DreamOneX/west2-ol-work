[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhihu-crawler"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fake-useragent>=2.2.0",
    "rich>=14.3.1",
    "selenium>=4.39.0",
    "webdriver-manager>=4.0.2",
]
authors = [
    { name = "DreamOneX", email = "me@dreamonex.eu.org" },
]

[project.scripts]
zhihu-topics = "zhihu_crawler.topics:crawl_zhihu_topics"
zhihu-details = "zhihu_crawler.details:crawl_details"

[tool.hatch.build.targets.wheel]
packages = ["src/zhihu_crawler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
